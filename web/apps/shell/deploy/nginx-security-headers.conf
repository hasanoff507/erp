# GENERATED from apps/shell/csp.ts — do not edit by hand (qaror #57, 15 §8, 24 §4.4).
# Regenerate: pnpm --filter shell exec node --experimental-strip-types deploy/write.ts
# Include inside the `server` block whose `root` is apps/shell/dist (backend paths — /api, /auth,
# /oauth, … — are proxied by their own, longer `location` blocks).
# Note: a nested `location` with its own add_header drops these — repeat the include there.

# Static files (hashed assets, sw.js, config.js, icons) and the SPA fallback.
location / {
    try_files $uri /index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' http://127.0.0.1:47110; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(self), serial=(self), bluetooth=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
}

# The SPA document: fresh style nonce per response, never cached (24 §4.4).
location = /index.html {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self' http://127.0.0.1:47110; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(self), serial=(self), bluetooth=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' '$request_id';
}
