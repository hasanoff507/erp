[project]
name = "erp-backend"
version = "0.1.0"
description = "ERP+POS SaaS backend (modular monolith)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "saq>=0.22",
    "redis>=5.2",
    "structlog>=24.4",
    "authlib>=1.3",
    "typer>=0.15",
    "uuid-utils>=0.10",
    "tenacity>=9.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "joserfc>=1.0",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "prometheus-client>=0.26",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "sentry-sdk>=2.72",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.9",
    "asyncpg-stubs>=0.30",
    "pip-audit>=2.7",
    "schemathesis>=4.31.1",
    "zxing-cpp>=3.1.1",
    "import-linter>=2.1",
    "types-openpyxl>=3.1.5.20260827",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["app/core/error_codes.py"]  # generated from 17 §15

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF", "N", "PT", "DTZ"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "PT018", "E501"]
"scripts/seed.py" = ["E501"]
"scripts/gen_migration_sql.py" = ["E501"]  # embedded SQL templates  # 12 §5.1 seed rows kept verbatim
"alembic/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app"]

[[tool.mypy.overrides]]
module = ["saq.*", "testcontainers.*", "authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    # 14 §6 mandates alg "EdDSA"; RFC 9864 prefers "Ed25519" (see app/modules/auth/application/keys.py)
    "ignore:EdDSA is deprecated via RFC 9864",
]
markers = [
    "db: needs a real PostgreSQL 16 (testcontainers or ERP_TEST_PG_ADMIN_URL)",
    "redis: needs a real Redis",
]

# 23 §1 module layering, enforced in CI (`uv run lint-imports`, 27 Bosqich 1):
# api → (wiring) → infrastructure → application → domain inside each module; application/domain never
# import any module's infrastructure/api directly (other modules only via application/domain/wiring);
# app.core never imports app.modules; domain stays free of DB/web frameworks.
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module layers (23 §1): api > wiring > infrastructure > application > domain"
type = "layers"
containers = ["app.modules.*"]
layers = ["(api)", "(wiring)", "(infrastructure)", "(application)", "(domain)"]

[[tool.importlinter.contracts]]
name = "application/domain see infrastructure only through ports (23 §1)"
type = "forbidden"
source_modules = ["app.modules.*.application", "app.modules.*.domain", "app.modules.*.*.application", "app.modules.*.*.domain"]
forbidden_modules = ["app.modules.*.infrastructure", "app.modules.*.api", "app.modules.*.*.infrastructure", "app.modules.*.*.api"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api does not reach into infrastructure (23 §1)"
type = "forbidden"
source_modules = ["app.modules.*.api", "app.modules.*.*.api"]
forbidden_modules = ["app.modules.*.infrastructure", "app.modules.*.*.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core is module-agnostic (23 §1)"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.main", "app.workers"]

[[tool.importlinter.contracts]]
name = "domain is pure Python (23 §1)"
type = "forbidden"
source_modules = ["app.modules.*.domain", "app.modules.*.*.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "redis", "asyncpg", "httpx", "saq"]
