packages:
  - apps/*
  - packages/pages/*
  - packages/shared/*
  - packages/shared/config/*

# Native postinstall scripts allowed to run (pnpm 10 blocks them by default).
onlyBuiltDependencies:
  - esbuild

# Single source of dependency versions for every workspace package (24 §4 library table).
catalog:
  # build / monorepo
  turbo: ^2.11.8
  typescript: ~6.0.3
  vite: ^8.3.4
  "@vitejs/plugin-react": ^6.1.2
  vite-plugin-pwa: ^2.0.0
  "@types/node": ^22.20.5
  # react
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react-router-dom: ^7.18.4
  # state / http
  effector: ^23.4.4
  effector-react: ^23.3.0
  patronum: ^2.3.0
  axios: ^1.20.0
  orval: ^8.43.0
  uuid: ^14.0.3
  # ui
  tailwindcss: ^3.4.19
  tailwindcss-animate: ^1.0.7
  postcss: ^8.5.30
  autoprefixer: ^10.6.1
  "@radix-ui/react-slot": ^1.5.0
  "@radix-ui/react-label": ^2.1.17
  "@radix-ui/react-dropdown-menu": ^2.2.1
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  # 24 §4.2: lucide renames icons between versions — locked exactly.
  lucide-react: 1.58.0
  "@fontsource-variable/manrope": ^5.3.0
  # forms (react-hook-form + zod, 24 §4) — added back with the first in-app form
  # i18n / format
  i18next: ^26.4.7
  react-i18next: ^17.0.19
  dayjs: ^1.11.23
  decimal.js: ^10.6.0
  # quality
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  typescript-eslint: ^8.71.2
  "@typescript-eslint/utils": ^8.71.2
  eslint-plugin-boundaries: ^7.2.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  globals: ^17.13.0
  prettier: ^3.9.10
  # tests
  vitest: ^5.0.5
  jsdom: ^30.1.3
  "@testing-library/react": ^16.3.3
  "@testing-library/jest-dom": ^7.0.1
  msw: ^3.0.3
  "@playwright/test": ^1.64.1

# Security fixes for transitive dependencies (CI gate: pnpm audit --audit-level=high, qaror #57).
overrides:
  # eslint-plugin-boundaries → handlebars ≤4.7.9: GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f (critical).
  handlebars: ">=4.7.10"

auditConfig:
  ignoreGhsas:
    # braces ≤3.0.3 (every published version, no patched release): ReDoS-style stack exhaustion on
    # deeply nested brace patterns. Pulled only by build/lint tooling (micromatch ← tailwindcss 3,
    # fast-glob, eslint-plugin-boundaries) that expands developer-written globs; never shipped to the
    # browser and never fed user input. Re-check when tailwindcss/micromatch drop braces.
    - GHSA-vfj7-8cjw-p6xm
