# Do'kon agenti CI (34 §12.6, 32 §1.3): .NET Framework 4.8 build + unit tests on Windows.
# Unsigned artefacts only — Authenticode and the manifest key never live in CI (34 §2.5, 26 #105).
name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent-1c/**"
      - "shared/agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "agent-1c/**"
      - "shared/agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-build:
    name: build + unit tests (net48)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore agent-1c/ErpOneCAgent.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build agent-1c/ErpOneCAgent.sln -c Release --no-restore -p:BuildNumber=${{ github.run_number }}

      - name: Unit tests (JCS/JWS/keyset/manifest vectors from shared/agent)
        run: dotnet test agent-1c/ErpOneCAgent.sln -c Release --no-build --logger trx --results-directory agent-1c/TestResults

      - name: Build stable channel (no DEV switches)
        run: dotnet build agent-1c/src/Erp1C.Agent/Erp1C.Agent.csproj -c Release --no-restore -p:AgentChannel=stable -p:AgentServerBase=https://erp.example.uz -p:AgentAppOrigins=https://app.erp.example.uz

      - name: No arbitrary 1C code in the binary (34 §8.1.2 blacklist)
        shell: pwsh
        run: |
          $hits = Get-ChildItem agent-1c/src -Recurse -Include *.cs | Select-String -Pattern 'Удалить|Вычислить|Выполнить\(' -List
          if ($hits) { $hits; throw 'forbidden 1C method name in agent sources' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-test-results
          path: agent-1c/TestResults
