# DAST before pilot (15 §8 "Penetratsion test" stage 1, qaror #23): OWASP ZAP passive scans
# against a freshly migrated + seeded backend. Fails on any FAIL rule of backend/ops/zap/rules.tsv
# and on any High-risk alert; WARN rules are reported (artifact) but do not fail the job.
name: dast

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/dast.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/dast.yml"
  schedule:
    - cron: "0 1 * * 1" # weekly, Monday 06:00 Tashkent — new ZAP rules catch up with main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  UV_PYTHON: "3.13"
  # ZAP image: the "stable" tag tracks the latest release (weekly schedule picks up new rules)
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
  API_URL: http://127.0.0.1:8000

jobs:
  zap:
    name: OWASP ZAP baseline + API (safe mode)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: database — roles (initdb.sh), alembic upgrade head, global seed
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          ERP_DB_NAME: erp_dast
          ERP_MIGRATOR_PASSWORD: dast_migrator
          ERP_APP_PASSWORD: dast_app
          ERP_MIGRATOR_DATABASE_URL: postgresql+asyncpg://erp_migrator:dast_migrator@localhost:5432/erp_dast
        run: |
          sh docker/postgres/initdb.sh
          uv run alembic upgrade head
          uv run python -m scripts.seed global

      - name: start the API (uvicorn, test environment, metrics behind a token)
        env:
          ERP_ENVIRONMENT: test
          ERP_LOG_JSON: "false"
          ERP_LOG_LEVEL: WARNING
          ERP_DATABASE_URL: postgresql+asyncpg://erp_app:dast_app@localhost:5432/erp_dast
          ERP_MIGRATOR_DATABASE_URL: postgresql+asyncpg://erp_migrator:dast_migrator@localhost:5432/erp_dast
          ERP_REDIS_URL: redis://localhost:6379/0
          ERP_PUBLIC_BASE_URL: http://127.0.0.1:8000
          ERP_METRICS_ENABLED: "true"
          ERP_METRICS_TOKEN: dast-only-metrics-token-not-a-secret-0001
          PYTHONIOENCODING: utf-8
        run: |
          nohup uv run uvicorn app.main:app_factory --factory --host 127.0.0.1 --port 8000 --no-access-log \
            > uvicorn.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf "$API_URL/health/ready" > /dev/null && break
            sleep 1
          done
          curl -sf "$API_URL/health/ready"

      - name: ZAP scans (baseline over the login flow, passive scan of the OpenAPI surface)
        working-directory: .
        run: |
          mkdir -p zap-wrk
          cp backend/ops/zap/rules.tsv zap-wrk/rules.tsv
          chmod -R a+rwX zap-wrk
          zap() { docker run --rm --network host -v "$PWD/zap-wrk:/zap/wrk:rw" "$ZAP_IMAGE" "$@"; }
          status=0
          # -I: WARN rules never fail; FAIL rules exit 1; 3 = scanner error
          zap zap-baseline.py -t "$API_URL/auth/login/start" -c rules.tsv -I -m 3 \
            -J baseline.json -r baseline.html -w baseline.md || status=$?
          # -S: safe mode — imports the OpenAPI definition and runs the passive scan only
          api_status=0
          zap zap-api-scan.py -t "$API_URL/api/v1/openapi.json" -f openapi -S -c rules.tsv -I \
            -J api.json -r api.html -w api.md || api_status=$?
          if [ "$api_status" -gt "$status" ]; then status=$api_status; fi
          echo "ZAP_STATUS=$status" >> "$GITHUB_ENV"

      - name: fail on FAIL rules or High-risk alerts
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          high = []
          for name in ("baseline.json", "api.json"):
              path = pathlib.Path("zap-wrk") / name
              if not path.exists():
                  sys.exit(f"{name} missing - the ZAP scan did not complete")
              for site in json.loads(path.read_text()).get("site", []):
                  for alert in site.get("alerts", []):
                      if int(alert.get("riskcode", 0)) >= 3:
                          high.append(f"{name}: [{alert.get('pluginid')}] {alert.get('alert')}")
          for line in high:
              print("HIGH", line)
          status = int(os.environ.get("ZAP_STATUS", "3"))
          if status != 0:
              print(f"ZAP exit status {status} (1 = FAIL rule hit, 3 = scanner error)")
          sys.exit(1 if high or status != 0 else 0)
          PY

      - name: API log
        if: failure()
        run: cat uvicorn.log

      - name: upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-wrk/*.html
            zap-wrk/*.json
            zap-wrk/*.md
          if-no-files-found: warn
