# Backend CI gates (23 §7.1, 32 §7.5, qaror #57)
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "spec/kod-uchun/12-db-sxema.md"
      - "spec/kod-uchun/17-api-umumiy.md"
      - "web/packages/shared/api/openapi.json"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - "spec/kod-uchun/12-db-sxema.md"
      - "spec/kod-uchun/17-api-umumiy.md"
      - "web/packages/shared/api/openapi.json"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  UV_PYTHON: "3.13"

jobs:
  quality:
    name: ruff + mypy --strict + spec drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app
      - name: module layering contracts (23 §1, import-linter)
        run: uv run lint-imports
      - name: backup/restore scripts are shellcheck-clean (15 §7, ops/backup)
        run: shellcheck -x -s bash ops/backup/*.sh
      - name: generated code matches the spec (17 §15 error codes, 12 DDL)
        run: |
          uv run python scripts/gen_error_codes.py --check
          uv run python scripts/gen_migration_sql.py --check
      - name: OpenAPI schema matches the committed web client schema (23 §7.1)
        run: uv run python scripts/export_openapi.py --check ../web/packages/shared/api/openapi.json

  test:
    name: pytest (PostgreSQL 16 + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ERP_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ERP_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: alembic upgrade head on an empty database (as erp_migrator)
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          ERP_DB_NAME: erp_ci
          ERP_MIGRATOR_PASSWORD: ci_migrator
          ERP_APP_PASSWORD: ci_app
          ERP_MIGRATOR_DATABASE_URL: postgresql+asyncpg://erp_migrator:ci_migrator@localhost:5432/erp_ci
        run: |
          sh docker/postgres/initdb.sh
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run pytest -q
      - name: schemathesis contract fuzzing (23 §7.1) against the migrated erp_ci database
        env:
          ERP_ENVIRONMENT: test
          ERP_LOG_JSON: "false"
          ERP_LOG_LEVEL: WARNING
          ERP_DATABASE_URL: postgresql+asyncpg://erp_app:ci_app@localhost:5432/erp_ci
          ERP_REDIS_URL: redis://localhost:6379/1
          PYTHONIOENCODING: utf-8
        run: |
          uv run uvicorn app.main:app_factory --factory --host 127.0.0.1 --port 8000 --no-access-log > uvicorn.log 2>&1 &
          api_pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health/ready > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health/ready
          status=0
          uv run schemathesis run http://127.0.0.1:8000/api/v1/openapi.json --checks not_a_server_error --no-color || status=$?
          kill "$api_pid" || true
          if [ "$status" -ne 0 ]; then cat uvicorn.log; fi
          exit "$status"

  security:
    name: pip-audit + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements.lock.txt
          uvx pip-audit -r requirements.lock.txt --disable-pip --progress-spinner off
      - name: gitleaks (whole repository history)
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

  image:
    name: docker build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t erp-backend:${{ github.sha }} .
