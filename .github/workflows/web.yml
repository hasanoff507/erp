# Web (back-office + web POS) CI — 32-kod-qoidalari.md §7.5 gates 5, 6, 6a; 24 §4; qaror #57.
name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  quality:
    name: audit · api drift · lint · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Gate 6a (qaror #57): dependency audit, high and above fails the build.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Gate 5: OpenAPI ↔ orval drift. Uses the committed schema (packages/shared/api/openapi.json);
      # once the backend job exports /openapi.json as an artifact it should be fetched here first.
      - name: Generated API client is up to date
        run: pnpm api:check

      - name: Lint (FSD boundaries, money rule, lucide rule)
        run: pnpm lint

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm typecheck

      - name: Unit tests (vitest)
        run: pnpm test

      - name: Build (Vite + PWA)
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter shell exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright, production build, strict CSP)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/apps/shell/playwright-report
          retention-days: 7
