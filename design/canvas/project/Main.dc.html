      <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="#1F8A4C"></circle></svg>Online · OFD sinxron

    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #F4F6F8; color: #3D4A5C; font-size: 12px; font-weight: 700;">

    <div style="display: flex; align-items: center; gap: 10px; padding-left: 6px;">

        </div>
      </div>
      <div role="tablist" aria-label="Kategoriyalar" style="display: flex; gap: 10px;">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button type="button" role="tab" aria-selected="{{c.sel}}" style="height: 48px; padding: 0 16px; border-radius: 999px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 700;">{{c.name}}</button>
        </sc-for>
      </div>
      <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 132px; gap: 12px; overflow: hidden;">
        <sc-for list="{{products}}" as="p" hint-placeholder-count="12">
          <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px; text-align: left; background: #FFFFFF; border: 1px solid #E7EAEE; border-radius: 16px; box-shadow: 0 1px 2px rgba(15,27,45,.04), 0 6px 20px rgba(15,27,45,.05); font: inherit; color: #0F1B2D;">
            <div style="display: flex; width: 100%; justify-content: space-between; align-items: flex-start;">

              <span style="padding: 3px 8px; border-radius: 999px; background: {{p.chipBg}}; color: {{p.chipFg}}; font-size: 11px; font-weight: 700;">{{p.chip}}</span>
            </div>
            <div style="font-size: 14px; font-weight: 700; line-height: 1.25;">{{p.name}}</div>
            <div style="margin-top: auto; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums;">{{p.price}}</div>
          </button>
        </sc-for>
      </div>

        <div style="font-size: 17px; font-weight: 700;">Chek #000483</div>
        <div style="flex-grow: 1;"></div>
        <button type="button" style="height: 48px; padding: 0 14px; border: 1px dashed #B9C2CD; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; color: #3D4A5C;">+ Mijoz <span style="padding: 2px 6px; border: 1px solid #DCE1E7; border-radius: 6px; font-size: 11px; font-weight: 600; color: #6B7686;">F3</span></button>
      </div>
      <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 6px 10px;">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #F0F2F5;">
            <div style="flex-grow: 1; min-width: 0;">
              <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{l.name}}</div>
              <div style="font-size: 12px; color: {{l.metaFg}};">{{l.meta}}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 4px; padding: 2px; background: #F4F6F8; border-radius: 10px;">
              <button type="button" aria-label="Kamaytirish" style="width: 48px; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700; color: #0F1B2D;">−</button>
              <span style="min-width: 44px; text-align: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">{{l.qty}}</span>
              <button type="button" aria-label="Ko'paytirish" style="width: 48px; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 20px; font-weight: 700; color: #0F1B2D;">+</button>
            </div>
            <div style="width: 100px; flex-shrink: 0; text-align: right; font-size: 24px; line-height: 32px; font-weight: 800; font-variant-numeric: tabular-nums;">{{l.sum}}</div>
          </div>
        </sc-for>
      </div>
      <div style="padding: 14px 18px 18px; background: #F8FAFB; border-top: 1px solid #E7EAEE; display: flex; flex-direction: column; gap: 6px;">

        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #1F6B3E;"><span>Chegirma</span><span style="font-variant-numeric: tabular-nums;">−2 000</span></div>

        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
          <button type="button" style="height: 48px; border: 1px solid #E7EAEE; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #0F1B2D;">Chegirma</button>
          <button type="button" style="height: 48px; border: 1px solid #F1D7A3; border-radius: 12px; background: #FDF3E1; font: inherit; font-size: 13px; font-weight: 700; color: #8A5A12;">Nasiya</button>
          <button type="button" style="height: 48px; border: 1px solid #F3CFCB; border-radius: 12px; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: #C8372D;">Bekor</button>
        </div>
        <a href="Pos03Tolov.dc.html" style="margin-top: 4px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 14px; background: #0E7C66; color: #FFFFFF; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 20px rgba(14,124,102,.28);">To'lovga o'tish <span style="padding: 2px 7px; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; font-size: 11px; font-weight: 600;">F4</span></a>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
  renderVals() {
    const cats = ["Hammasi", "Non va un", "Sut mahsulotlari", "Bakaleya", "Ichimliklar", "Shirinliklar"];
    const tiles = [["#E3F2EE","#0A5E4D"],["#E8F0FC","#1F4FA8"],["#FDF3E1","#8A5A12"],["#EFEAFC","#6D4AD8"],["#FBEAE8","#A82B22"]];
    const prod = [
      ["Non «Patir»","4 000","NP","dona"],["Sut 2,5% 1 l","13 500","SU","dona"],["Guruch «Lazer»","18 000 / kg","GR","tarozi"],["Choy ko'k 100 g","21 000","CH","dona"],
      ["Gazli ichimlik 1,5 l","9 000","GI","markirovka"],["Shakar","12 500 / kg","SH","tarozi"],["Tuxum 10 dona","16 000","TX","dona"],["Kungaboqar yog'i 1 l","24 000","KY","dona"],
      ["Makaron 500 g","8 500","MK","dona"],["Pishloq 200 g","28 000","PS","dona"],["Qatiq 0,5 l","7 000","QT","dona"],["Somsa","6 000","SM","dona"]
    ];
    const chip = { "dona": ["#F4F6F8","#3D4A5C"], "tarozi": ["#E8F0FC","#1F4FA8"], "markirovka": ["#EFEAFC","#6D4AD8"] };
    return {
      cats: cats.map((n, i) => ({ name: n, sel: i === 0 ? "true" : "false", bg: i === 0 ? "#0F1B2D" : "#FFFFFF", fg: i === 0 ? "#FFFFFF" : "#3D4A5C", bd: i === 0 ? "#0F1B2D" : "#E7EAEE" })),
      products: prod.map(([name, price, ini, kind], i) => ({ name, price, ini, chip: kind, chipBg: chip[kind][0], chipFg: chip[kind][1], tile: tiles[i % 5][0], tileFg: tiles[i % 5][1] })),
      lines: [
        { name: "Non «Patir»", meta: "4 000 × 2", qty: "2", sum: "8 000", metaFg: "#6B7686" },
        { name: "Sut 2,5% 1 l", meta: "13 500 × 2", qty: "2", sum: "27 000", metaFg: "#6B7686" },
        { name: "Guruch «Lazer»", meta: "1,250 kg × 18 000", qty: "1,250", sum: "22 500", metaFg: "#6B7686" },
        { name: "Choy ko'k 100 g", meta: "Chegirma −2 000", qty: "1", sum: "19 000", metaFg: "#1F6B3E" },
        { name: "Gazli ichimlik 1,5 l", meta: "Markirovka kodi skanerlandi", qty: "2", sum: "18 000", metaFg: "#6D4AD8" }
      ]
    };
  }
}
</script>
